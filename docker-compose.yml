name: dos-lab

networks:
  lab-net:
    internal: true   # sem rota para a internet — tráfego fica isolado na rede do compose

services:

  target:
    build: ./target
    container_name: target
    hostname: target
    networks: [lab-net]
    ports:
      - "8080:80"       # site (view do aluno)
    cpus: "1.0"
    mem_limit: 256m
    cap_add:
      - NET_ADMIN         # permite o script de mitigação ligar tcp_syncookies em runtime
    sysctls:
      - net.ipv4.tcp_syncookies=0   # começa desligado; o aluno liga na etapa de mitigação

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    networks: [lab-net]
    command: ["-nginx.scrape-uri=http://target/status"]
    depends_on: [target]
    cpus: "0.2"
    mem_limit: 64m

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    networks: [lab-net]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    cpus: "0.5"
    mem_limit: 256m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    networks: [lab-net]
    cpus: "0.3"
    mem_limit: 128m
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    networks: [lab-net]
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    cpus: "0.5"
    mem_limit: 256m

  attacker:
    build: ./attacker
    container_name: attacker
    networks: [lab-net]
    cap_add:
      - NET_RAW          # necessário para hping3 montar pacotes SYN
    cpus: "0.5"
    mem_limit: 128m
    tty: true
    stdin_open: true
    command: ["sleep", "infinity"]   # aluno entra com docker exec e roda os scripts manualmente

  k6:
    image: grafana/k6:0.52.0
    container_name: k6
    networks: [lab-net]
    volumes:
      - ./k6:/scripts:ro
    cpus: "0.3"
    mem_limit: 128m
    entrypoint: ["sleep", "infinity"]
