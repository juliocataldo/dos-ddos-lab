# Config MITIGADA — ativada pelo script mitigate-slowloris.sh
# Contramedida específica para Slowloris: corta conexões lentas e limita conexões simultâneas por IP.

limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name target;

    client_header_timeout 5s;   # Slowloris manda headers aos poucos — isso corta a espera
    client_body_timeout 5s;
    send_timeout 5s;

    limit_conn perip 20;        # trava o número de conexões simultâneas por IP de origem

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /status {
        stub_status on;
        allow all;
    }
}
