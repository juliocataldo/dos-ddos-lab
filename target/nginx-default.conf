# Config BASELINE — sem contramedidas de aplicação.
# Isso é intencional: o aluno vai sentir o site cair antes de aplicar a mitigação.

server {
    listen 80;
    server_name target;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Endpoint "caro": compressão gzip em tempo real, sem limite de taxa.
    # É o alvo do HTTP flood — barato de atacar, caro de responder.
    location = /heavy.txt {
        root /usr/share/nginx/html;
        gzip on;
        gzip_types text/plain;
        gzip_comp_level 9;
        gzip_min_length 1;
    }

    location /status {
        stub_status on;
        allow all;
    }
}
