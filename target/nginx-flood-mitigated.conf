# Config MITIGADA — ativada pelo script mitigate-flood.sh
# Contramedida para HTTP flood: limita a TAXA de requisições por IP
# (diferente do limit_conn do Slowloris, que limita CONEXÕES simultâneas).

limit_req_zone $binary_remote_addr zone=reqlimit:10m rate=5r/s;

server {
    listen 80;
    server_name target;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location = /heavy.txt {
        root /usr/share/nginx/html;
        gzip on;
        gzip_types text/plain;
        gzip_comp_level 9;
        gzip_min_length 1;

        limit_req zone=reqlimit burst=10 nodelay;
    }

    location /status {
        stub_status on;
        allow all;
    }
}
