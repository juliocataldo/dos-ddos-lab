# Config BASELINE — sem contramedidas de aplicação.
# Isso é intencional: o aluno vai sentir o site cair antes de aplicar a mitigação.

server {
    listen 80;
    server_name target;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /status {
        stub_status on;
        allow all;
    }
}
